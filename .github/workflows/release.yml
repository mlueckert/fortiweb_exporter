name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write      # create tags and releases, upload assets
  issues: write        # comment on released issues
  pull-requests: write # comment on released pull requests

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Vulnerability check
        run: make vulncheck

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release -p @semantic-release/exec semantic-release
